[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "HornCAD"
version = "0.0.0"
description = "Browser-based horn and waveguide geometry tool."
requires-python = ">=3.13,<3.14"
dependencies = [
    "bempp-cl>=0.4.2",
    "cadquery>=2.8",
    "gmsh>=4.15",
    "manifold3d>=3.5",
    "mapbox-earcut>=2.0",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "scikit-fem>=12.0",
    "scipy>=1.18",
    "shapely>=2.1",
    "trimesh>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
acoustics-native = [
    "meshio>=5.3",
    "rtree>=1.4",
    "wildmeshing==0.4.0",
]
